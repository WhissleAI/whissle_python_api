[project]
name = "whissle"
version = "0.2.0"
description = "DEPRECATED — the Whissle Python client is now `whissle-sdk` (import `whissle_sdk`). This package only tells you so."
authors = [{ name = "Whissle AI", email = "support@whissle.ai" }]
readme = "README.md"
requires-python = ">=3.8"

# SPDX expression plus the file itself (PEP 639). The old table form,
# `license = {file = "LICENSE"}`, inlined the whole licence file into the
# free-text `License:` metadata field — which is how 0.0.1 shipped the GPL-3
# text and the MIT classifier at the same time.
license = "MIT"
license-files = ["LICENSE"]

keywords = ["whissle", "deprecated", "stt", "tts", "streaming", "real-time"]

classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    # No "License :: OSI Approved ::" classifier: PEP 639 forbids pairing one
    # with a `License-Expression`, and PyPI rejects an upload that does.
    "Natural Language :: English",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]

# None. A deprecation notice needs no HTTP client, no settings loader and no
# validation library; `pip install whissle` should not drag a dependency tree
# onto someone whose only remaining use for it is to be told to uninstall it.
dependencies = []

[project.optional-dependencies]
# The tombstone's behaviour is its whole contract, so it has a test suite.
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://whissle.ai"
Repository = "https://github.com/WhissleAI/whissle_python_api"
Changelog = "https://github.com/WhissleAI/whissle_python_api/blob/main/CHANGELOG.md"

[build-system]
# >=77 for PEP 639 `License-Expression` support; without it the SPDX
# expression is silently dropped back to a free-text field.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Named, not discovered. There is one package and it should stay that way.
packages = ["whissle", "whissle.clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
